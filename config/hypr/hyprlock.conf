$font = Inter
$icons = JetBrainsMono Nerd Font
$tint = rgba(255, 226, 255, 0.96)
$white = rgba(255, 255, 255, 0.90)
$glass = rgba(255, 255, 255, 0.20)
$error = rgb(255, 98, 92)

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = macEase, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, macEase
    animation = fadeOut, 1, 2, macEase
    animation = inputFieldDots, 1, 2, macEase
}

background {
    monitor =
    path = /home/asad/Pictures/wallpapers/macos-sonoma-light-1920.jpg
    color = rgb(45, 55, 95)
    blur_passes = 0
    brightness = 1.0
}

# Compact macOS Sonoma date and time.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $tint
    font_size = 21
    font_family = Inter Medium
    position = 0, -97
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.18)
}

label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $tint
    font_size = 95
    font_family = $font
    position = 0, -124
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.18)
}

# Minimal status group from the macOS menu bar.
label {
    monitor =
    text = U.S.  󰌌        
    color = $white
    font_size = 9
    font_family = $icons
    position = -24, -4
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.22)
}

# Small account control near the bottom edge.
image {
    monitor =
    path = /home/asad/Pictures/avatar.png
    size = 52
    rounding = -1
    border_size = 1
    border_color = rgba(255, 255, 255, 0.76)
    position = 0, -394
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.30)
}

image {
    monitor =
    path = /home/asad/Pictures/avatar-badge.png
    size = 20
    rounding = -1
    border_size = 0
    position = 19, -413
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 160, 30
    outline_thickness = 1
    inner_color = $glass
    outer_color = rgba(255, 255, 255, 0.08)
    check_color = rgba(255, 255, 255, 0.42)
    fail_color = $error
    font_color = rgba(255, 255, 255, 0.84)
    swap_font_color = false
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = <span size='10pt'>Enter Password</span>
    fail_text = $FAIL
    dots_center = true
    dots_spacing = 0.22
    dots_size = 0.14
    position = 0, -448
    halign = center
    valign = center
}
