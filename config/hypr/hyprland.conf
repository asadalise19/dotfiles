

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

# autogenerated = 1

input {
    numlock_by_default = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

$mainMod = SUPER
$terminal = ghostty
env = TERMINAL,ghostty
env = GNOME_KEYRING_CONTROL,/run/user/1000/keyring
$fileManager = nautilus
$browser = google-chrome-stable
$menu = ambxst run launcher
exec-once=vicinae server

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod ALT, P, exec, systemctl poweroff
bind = $mainMod ALT, R, exec, systemctl reboot
# bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, Space, exec, vicinae toggle

# Alt+Tab window switching
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Ambxst
source = ~/.local/share/ambxst/hyprland.conf

# OVERRIDES
# Down here you can write or source anything that you want to override from Ambxst's settings.

unbind = $mainMod SHIFT, A
bind = $mainMod SHIFT, A, exec, ambxst run lens
unbind = $mainMod, A
unbind = $mainMod, V
bind = $mainMod, V, exec, vicinae deeplink 'vicinae://launch/clipboard/history'
monitor = eDP-1, 1920x1080@60, 0x0, 1.25

unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%-

unbind = , XF86Calculator
bind = , XF86Calculator, exec, gnome-calculator
